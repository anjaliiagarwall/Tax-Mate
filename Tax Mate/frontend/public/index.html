<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Web site created using create-react-app" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>React App</title>
  <!-- Google Translate Widget Script -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,as,bn,gu,hi,kn,ml,mr,mni-Mtei,or,pa,ta,te,ur',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript"
    src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <style>
    /* Prevent React layout shifts and hide the Google Translate widget completely */
    iframe.goog-te-banner-frame {
      display: none !important;
    }

    .goog-te-banner-frame,
    .goog-te-banner-frame.skiptranslate,
    .goog-te-gadget-icon,
    .VIpgJd-ZVi9od-ORHb-OEVmcd {
      display: none !important;
    }

    body {
      top: 0px !important;
      position: static !important;
    }

    html {
      height: 100% !important;
    }

    #google_translate_element {
      position: absolute !important;
      left: -9999px !important;
      top: -9999px !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      pointer-events: none !important;
      overflow: hidden !important;
    }

    /* Hide the floating tooltip that appears on hover over translated text */
    .goog-text-highlight {
      background-color: transparent !important;
      box-shadow: none !important;
    }

    /* Hide the "Original text" popup */
    #goog-gt-tt,
    .goog-te-balloon-frame {
      display: none !important;
    }
  </style>
</head>

</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="google_translate_element"></div>
  <div id="root"></div>

  <!-- Agressive Cleanup for Google Translate -->
  <script>
    (function () {
      // 1. Force React to not crash on text node mutations
      if (typeof Node === 'function' && Node.prototype) {
        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child.parentNode !== this) return child;
          return originalRemoveChild.apply(this, arguments);
        };
        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) return newNode;
          return originalInsertBefore.apply(this, arguments);
        };
      }

      // 2. Bruteforce wipe the banner and body displacement
      setInterval(() => {
        document.body.style.top = '0px';
        const frames = document.querySelectorAll('iframe.goog-te-banner-frame, .goog-te-banner-frame');
        frames.forEach(f => {
          f.style.display = 'none';
        });
      }, 50);
    })();
  </script>

    -->
</body>

</html>
